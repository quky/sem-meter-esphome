# SEM Electric Panel Card example.
# Every device and entity ID below is intentionally fictional.
type: custom:sem-electric-panel-card
title: Example Electrical Panel
device_id: replace_with_sem_meter_device_id
panel_size: 24
show_empty_positions: true
numbering_style: circuit
measurement_decimals: 1
energy_decimals: 2

main:
  name: Main Breaker
  power_entity: sensor.example_sem_total_power
  current_entity: sensor.example_sem_total_current
  line_1_entity: sensor.example_sem_line_1_power
  line_2_entity: sensor.example_sem_line_2_power

clamps:
  - clamp: 1
    entity: sensor.example_sem_clamp_01_power
    name: Kitchen Receptacles
    circuit: "1"
    icon: mdi:countertop
    unit: W
    breaker_type: single
    breaker_rating: 20

  # Clamp 4 remains measurement channel 4 while rendering at positions 13–15.
  - clamp: 4
    entity: sensor.example_sem_clamp_04_power
    name: Air Conditioner
    circuit: "13-15"
    circuit_position: 13
    icon: mdi:air-conditioner
    unit: W
    breaker_type: double
    breaker_rating: 30

# Manual physical positions do not add SEM Meter clamp channels.
panel_positions:
  - position: 17
    entity: sensor.example_garage_lights_power
    name: Garage Lights
    circuit: "17"
    icon: mdi:lightbulb
    unit: auto
    breaker_type: single
    breaker_rating: 15

  # A two-pole breaker starting at Position 19 consumes Position 21 visually.
  - position: 19
    entity: sensor.example_water_heater_power
    name: Water Heater
    circuit: "19-21"
    icon: mdi:water-boiler
    unit: W
    breaker_type: double
    breaker_rating: 30

  # A tandem uses one position and two independent entities/click targets.
  - position: 23
    entity: sensor.example_workshop_upper_power
    name: Workshop Upper
    circuit: "23A/B"
    breaker_type: tandem
    breaker_rating: 15
    tandem_entity: sensor.example_workshop_lower_power
    tandem_name: Workshop Lower
    tandem_icon: mdi:power-socket-us
    tandem_unit: W
    tandem_breaker_rating: 20
