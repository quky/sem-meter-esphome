# SEM Electric Panel Card example.
# All entity IDs below are intentionally fake. Replace them with real sensors.
type: custom:sem-electric-panel-card
title: Example Electrical Panel

main:
  name: Main Breaker
  power_entity: sensor.example_sem_total_power
  current_entity: sensor.example_sem_total_current
  line_1_entity: sensor.example_sem_line_1_power
  line_2_entity: sensor.example_sem_line_2_power

clamps:
  # Odd clamps render on the left; even clamps render on the right.
  - clamp: 1
    entity: sensor.example_sem_clamp_01_power
    name: Kitchen Receptacles
    circuit: "1"
    icon: mdi:countertop
    unit: W
    poles: 1

  - clamp: 2
    entity: sensor.example_sem_clamp_02_current
    name: Refrigerator
    circuit: "2"
    icon: mdi:fridge-outline
    unit: A
    poles: 1

  - clamp: 3
    entity: sensor.example_sem_clamp_03_power
    name: Laundry
    circuit: "3"
    icon: mdi:washing-machine
    unit: auto
    poles: 1

  - clamp: 4
    entity: sensor.example_sem_clamp_04_power
    name: Water Heater
    circuit: "4-6"
    icon: mdi:water-boiler
    unit: kW
    poles: 2

  - clamp: 5
    entity: sensor.example_sem_clamp_05_power
    name: Bedroom Outlets
    circuit: "5"
    icon: mdi:power-socket-us
    unit: W
    poles: 1

  - clamp: 6
    entity: sensor.example_sem_clamp_06_power
    name: Range
    circuit: "6-8"
    icon: mdi:stove
    unit: auto
    poles: 2

  - clamp: 7
    entity: sensor.example_sem_clamp_07_current
    name: Garage
    circuit: "7"
    icon: mdi:garage
    unit: A
    poles: 1

  - clamp: 8
    entity: sensor.example_sem_clamp_08_power
    name: Air Conditioner
    circuit: "8-10"
    icon: mdi:air-conditioner
    unit: W
    poles: 2

  - clamp: 9
    entity: sensor.example_sem_clamp_09_power
    name: Lighting
    circuit: "9"
    icon: mdi:lightbulb-group-outline
    unit: auto
    poles: 1

  - clamp: 10
    entity: sensor.example_sem_clamp_10_power
    name: Pool Pump
    circuit: "10-12"
    icon: mdi:pool
    unit: kW
    poles: 2

  - clamp: 11
    entity: sensor.example_sem_clamp_11_power
    name: Office
    circuit: "11"
    icon: mdi:desk
    unit: W
    poles: 1

  - clamp: 12
    entity: sensor.example_sem_clamp_12_current
    name: Dishwasher
    circuit: "12"
    icon: mdi:dishwasher
    unit: A
    poles: 1

  - clamp: 13
    entity: sensor.example_sem_clamp_13_power
    name: Workshop
    circuit: "13"
    icon: mdi:tools
    unit: auto
    poles: 1

  - clamp: 14
    entity: sensor.example_sem_clamp_14_power
    name: EV Charger
    circuit: "14-16"
    icon: mdi:ev-station
    unit: kW
    poles: 2

  - clamp: 15
    entity: sensor.example_sem_clamp_15_power
    name: Outdoor Receptacles
    circuit: "15"
    icon: mdi:outdoor-lamp
    unit: W
    poles: 1

  - clamp: 16
    entity: sensor.example_sem_clamp_16_power
    name: Heat Pump
    circuit: "16-18"
    icon: mdi:heat-pump-outline
    unit: auto
    poles: 2
