esphome:
  name: sem-meter
  friendly_name: SEM Meter

external_components:
  - source:
      type: local
      path: components

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  level: INFO
  logs:
    sensor: WARN

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "SEM Meter Fallback"
    password: "semmeter123"

captive_portal:

web_server:
  port: 80

button:
  - platform: restart
    name: "Restart SEM Meter"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"
    mac_address:
      name: "MAC Address"

time:
  - platform: sntp
    id: sntp_time

uart:
  id: meter_uart
  rx_pin: GPIO39
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 1024

sem_meter:
  id: sem_meter_parser
  branch_power_divisor: 95.0
  main_power_divisor: 102.0
  voltage_divisor: 10.30

