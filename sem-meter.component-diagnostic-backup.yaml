  - platform: template
    name: "Balance Power"
    id: balance_power
    update_interval: 5s
    unit_of_measurement: "W"
    accuracy_decimals: 1
    device_class: power
    state_class: measurement
    lambda: |-
      const float branches =
          id(circuit_1_power).state + id(circuit_2_power).state +
          id(circuit_3_power).state + id(circuit_4_power).state +
          id(circuit_5_power).state + id(circuit_6_power).state +
          id(circuit_7_power).state + id(circuit_8_power).state +
          id(circuit_9_power).state + id(circuit_10_power).state +
          id(circuit_11_power).state + id(circuit_12_power).state +
          id(circuit_13_power).state + id(circuit_14_power).state +
          id(circuit_15_power).state + id(circuit_16_power).state;
      const float balance = id(total_main_power).state - branches;
      return balance > 0.0f ? balance : 0.0f;

