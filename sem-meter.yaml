    id: generate_diagnostic_report
    entity_category: diagnostic
    on_press:
      - lambda: id(sem_meter_parser).generate_diagnostic_report();

# Onboard passive buzzer confirmed on GPIO41.
# Requires LEDC/PWM; a static GPIO pulse does not produce a tone.
output:
  - platform: ledc
    pin: GPIO41
    id: buzzer_output

rtttl:
  output: buzzer_output
  gain: 30%

script:
  # Three short warning tones, played once when parser communication is lost.
  - id: buzzer_parser_lost
    mode: single
    then:
      - rtttl.play: "parser lost:d=16,o=6,b=120:c,p,c,p,c"

  # One short positive chirp, played once when parser communication recovers.
  - id: buzzer_parser_recovered
    mode: single
    then:
      - rtttl.play: "parser recovered:d=16,o=6,b=160:g"

  # Two longer descending tones, distinct from the parser warning.
  - id: buzzer_wifi_lost
    mode: single
    then:
      - rtttl.play: "wifi lost:d=8,o=5,b=90:g,e"

  # Two short ascending chirps for restored Wi-Fi connectivity.
  - id: buzzer_wifi_recovered
    mode: single
    then:
      - rtttl.play: "wifi recovered:d=16,o=6,b=160:c,g"

  # One very short neutral chirp when a manual self-test starts.
  - id: buzzer_self_test_start
    mode: single
    then:
      - rtttl.play: "self test start:d=32,o=6,b=180:e"

  # Three short ascending tones when every self-test check passes.
  - id: buzzer_self_test_pass
    mode: single
    then:
      - rtttl.play: "self test pass:d=16,o=6,b=180:c,e,g"

  # One long low tone followed by two short low tones on self-test failure.
  - id: buzzer_self_test_fail
    mode: single
    then:
      - rtttl.play: "self test fail:d=16,o=4,b=80:4c,16p,16c,16p,16c"

