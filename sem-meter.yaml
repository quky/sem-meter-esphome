# Values decoded from the AT32 metering processor.
globals:
  - id: raw_w
    type: float[16]
    restore_value: no

  - id: raw_pa
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: raw_pb
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: raw_pc
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: line_v_a
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: line_v_b
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: line_hz
    type: float
    restore_value: no
    initial_value: "0.0"

uart:
  id: meter_uart
  rx_pin: GPIO39
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 1024

  debug:
    direction: RX
    dummy_receiver: true
    after:
      timeout: 250ms
    sequence:
      - lambda: |-
          static std::vector<uint8_t> accumulated;

          accumulated.insert(
              accumulated.end(),
              bytes.begin(),
              bytes.end()
          );

          if (accumulated.size() < 447) {
            return;
          }

          const auto &b = accumulated;
          const int n = static_cast<int>(b.size());

          for (int i = 0; i + 22 < n; i++) {
            // This meter uses both FF and 3B as record markers.
            if (b[i] != 0xFF && b[i] != 0x3B) {
              continue;
            }

            const uint8_t record = b[i + 1];

            if (record > 0x12) {
              continue;
            }

            const uint8_t status = b[i + 2];

            if (status != 0x01 &&
                status != 0x03 &&
                status != 0x07) {
              continue;
            }

            const uint8_t *r = &b[i + 2];

            const uint32_t raw_power =
                (static_cast<uint32_t>(r[12]) << 24) |
                (static_cast<uint32_t>(r[13]) << 16) |
                (static_cast<uint32_t>(r[14]) << 8) |
                static_cast<uint32_t>(r[15]);

            const uint16_t raw_voltage =
                (static_cast<uint16_t>(r[4]) << 8) |
                static_cast<uint16_t>(r[5]);

            if (status == 0x01) {
              if (record <= 0x0F) {
                id(raw_w)[record] = 0.0f;
              } else if (record == 0x10) {
                id(raw_pa) = 0.0f;
              } else if (record == 0x11) {
                id(raw_pb) = 0.0f;
              } else if (record == 0x12) {
                id(raw_pc) = 0.0f;
              }

              continue;
            }

            if (record <= 0x0F) {
              id(raw_w)[record] = raw_power / 95.0f;

            } else if (record == 0x10) {
              id(raw_pa) = raw_power / 102.0f;

              if (raw_voltage > 900) {
                id(line_v_a) = raw_voltage / 10.30f;
                id(line_hz) = static_cast<float>(r[20]);
              }

            } else if (record == 0x11) {
              id(raw_pb) = raw_power / 102.0f;

              if (raw_voltage > 900) {
                id(line_v_b) = raw_voltage / 10.30f;
              }

            } else if (record == 0x12) {
              id(raw_pc) = raw_power / 102.0f;
            }
          }

          accumulated.clear();

