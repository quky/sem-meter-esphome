    id: phase_a_voltage
    update_interval: 5s
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement
    lambda: |-
      return id(line_v_a);

  - platform: template
    name: "Phase B Voltage"
