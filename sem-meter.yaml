sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 30s

  - platform: uptime
    name: "Uptime"

  - platform: template
    name: "Phase A Voltage"
    id: phase_a_voltage
    update_interval: 5s
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement
    lambda: |-
      return id(sem_meter_parser).get_phase_a_voltage();
    filters:
      - lambda: |-
          return id(sem_meter_parser).validate_sensor_value(
              esphome::sem_meter::MeasurementId::PHASE_A_VOLTAGE, x);

  - platform: template
    name: "Phase B Voltage"
    id: phase_b_voltage
    update_interval: 5s
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement
    lambda: |-
      return id(sem_meter_parser).get_phase_b_voltage();
    filters:
      - lambda: |-
          return id(sem_meter_parser).validate_sensor_value(
              esphome::sem_meter::MeasurementId::PHASE_B_VOLTAGE, x);

  - platform: template
    name: "Line Frequency"
    id: line_frequency
    update_interval: 5s
    unit_of_measurement: "Hz"
    accuracy_decimals: 0
    device_class: frequency
    state_class: measurement
    lambda: |-
      return id(sem_meter_parser).get_line_frequency();
    filters:
      - lambda: |-
          return id(sem_meter_parser).validate_sensor_value(
              esphome::sem_meter::MeasurementId::LINE_FREQUENCY, x);

  - platform: template
    name: "Main Phase A Power"
    id: main_phase_a_power
    update_interval: 5s
    unit_of_measurement: "W"
    accuracy_decimals: 1
    device_class: power
    state_class: measurement
    lambda: |-
      return id(sem_meter_parser).get_phase_a_power();
    filters:
      - lambda: |-
          return id(sem_meter_parser).validate_sensor_value(
              esphome::sem_meter::MeasurementId::MAIN_PHASE_A_POWER, x);

  - platform: template
    name: "Main Phase B Power"
    id: main_phase_b_power
    update_interval: 5s
    unit_of_measurement: "W"
    accuracy_decimals: 1
    device_class: power
    state_class: measurement
    lambda: |-
      return id(sem_meter_parser).get_phase_b_power();
    filters:
      - lambda: |-
          return id(sem_meter_parser).validate_sensor_value(
              esphome::sem_meter::MeasurementId::MAIN_PHASE_B_POWER, x);

  - platform: template
    name: "Main Phase C Power"
    id: main_phase_c_power
    update_interval: 5s
    unit_of_measurement: "W"
    accuracy_decimals: 1
    device_class: power
    state_class: measurement
    lambda: |-
      return id(sem_meter_parser).get_phase_c_power();
    filters:
      - lambda: |-
          return id(sem_meter_parser).validate_sensor_value(
              esphome::sem_meter::MeasurementId::MAIN_PHASE_C_POWER, x);

  - platform: template
    name: "Total Main Power"
    id: total_main_power
    update_interval: 5s
    unit_of_measurement: "W"
    accuracy_decimals: 1
    device_class: power
    state_class: measurement
    lambda: |-
      return id(sem_meter_parser).get_phase_a_power() +
             id(sem_meter_parser).get_phase_b_power() +
             id(sem_meter_parser).get_phase_c_power();
    filters:
      - lambda: |-
          return id(sem_meter_parser).validate_sensor_value(
              esphome::sem_meter::MeasurementId::TOTAL_MAIN_POWER, x);

  - platform: template
    name: "${circuit_1_name} Power"
    id: circuit_1_power
    update_interval: 5s
    unit_of_measurement: "W"
    accuracy_decimals: 1
    device_class: power
    state_class: measurement
    lambda: |-
      if (!id(circuit_1_enabled).state) return 0.0f;
      return id(sem_meter_parser).get_branch_power(0) * (id(circuit_1_240v_multiplier).state ? 2.0f : 1.0f);
    filters:
      - lambda: |-
          return id(sem_meter_parser).validate_sensor_value(
              esphome::sem_meter::MeasurementId::CIRCUIT_1_POWER, x);
