  rx_pin: GPIO39
  baud_rate: 115200
  data_bits: 8
  parity: NONE
  stop_bits: 1
  rx_buffer_size: 1024

sem_meter:
  id: sem_meter_parser
  branch_power_divisor: 95.0
  main_power_divisor: 102.0
  voltage_divisor: 10.30
  sem_meter_healthy:
    name: "SEM Meter Healthy"
    disabled_by_default: false
  uart_healthy:
    name: "UART Healthy"
    disabled_by_default: false
  component_state:
    name: "Component State"
    disabled_by_default: false
  last_event:
    name: "Last Event"
    disabled_by_default: false
    on_value:
      then:
        - if:
            condition:
              lambda: return x == "UART_TIMEOUT";
            then:
              - script.execute: buzzer_parser_lost
        - if:
            condition:
              lambda: return x == "UART_RESTORED";
            then:
              - script.execute: buzzer_parser_recovered
        - if:
            condition:
              lambda: return x == "WIFI_TIMEOUT";
            then:
              - script.execute: buzzer_wifi_lost
        - if:
            condition:
              lambda: return x == "WIFI_RESTORED";
            then:
              - script.execute: buzzer_wifi_recovered
  startup_grace_period: 30s
  uart_timeout: 10s
  wifi_startup_grace_period: 180s
  wifi_outage_threshold: 120s
  sem_parser_healthy:
    name: "SEM Parser Healthy"
    id: sem_parser_healthy
    disabled_by_default: false
  sem_diagnostic_status:
    name: "SEM Diagnostic Status"
    id: sem_diagnostic_status
    disabled_by_default: false
  sem_last_valid_frame_age:
    name: "SEM Last Valid Frame Age"
    id: sem_last_valid_frame_age
    disabled_by_default: false
  sem_last_parser_outage_duration:
    name: "SEM Last Parser Outage Duration"
    id: sem_last_parser_outage_duration
    disabled_by_default: false
  sem_wifi_healthy:
    name: "SEM WiFi Healthy"
    id: sem_wifi_healthy
    disabled_by_default: false
  sem_wifi_diagnostic_status:
    name: "SEM WiFi Diagnostic Status"
    id: sem_wifi_diagnostic_status
    disabled_by_default: false
  sem_last_wifi_outage_duration:
    name: "SEM Last WiFi Outage Duration"
    id: sem_last_wifi_outage_duration
    disabled_by_default: false
  sem_wifi_disconnect_age:
    name: "SEM WiFi Disconnect Age"
    id: sem_wifi_disconnect_age
    disabled_by_default: false
  sem_self_test_status:
    name: "SEM Self-Test Status"
    id: sem_self_test_status
    disabled_by_default: false
    on_value:
      then:
        - if:
            condition:
              lambda: return x == "RUNNING";
            then:
              - script.execute: buzzer_self_test_start
        - if:
            condition:
              lambda: return x == "PASS";
            then:
              - script.execute: buzzer_self_test_pass
        - if:
            condition:
              lambda: return x == "FAIL";
            then:
              - script.execute: buzzer_self_test_fail
  sem_self_test_summary:
    name: "SEM Self-Test Summary"
    id: sem_self_test_summary
    disabled_by_default: false
  sem_self_test_failed_checks:
    name: "SEM Self-Test Failed Checks"
    id: sem_self_test_failed_checks
    disabled_by_default: false
  sem_last_self_test_duration:
    name: "SEM Last Self-Test Duration"
    id: sem_last_self_test_duration
    disabled_by_default: false
  sem_component_version:
    name: "SEM Component Version"
    id: sem_component_version
    disabled_by_default: false
  sem_esphome_version:
    name: "SEM ESPHome Version"
    id: sem_esphome_version
    disabled_by_default: false
  sem_hardware_profile:
    name: "SEM Hardware Profile"
